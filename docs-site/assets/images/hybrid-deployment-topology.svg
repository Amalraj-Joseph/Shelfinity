<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Archivo, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrowHb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ec3013"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="420" fill="#eae9e9" stroke="#8c8686" stroke-width="1.5"/>

  <text x="30" y="42" font-size="13" font-weight="800" fill="#201e1d">HYBRID — the app runs locally, the data and identity don't</text>

  <rect x="30" y="80" width="330" height="150" fill="#f3f2f2" stroke="#8c8686" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text x="52" y="104" font-size="11" font-weight="700" fill="#6b6767">YOUR MACHINE — docker-compose.cloud-services.yml</text>

  <rect x="52" y="120" width="110" height="86" fill="#ffffff" stroke="#8c8686" stroke-width="1.25"/>
  <text x="107" y="157" text-anchor="middle" font-size="12.5" font-weight="700" fill="#201e1d">Browser</text>
  <text x="107" y="175" text-anchor="middle" font-size="10" fill="#6b6767">:3000</text>

  <line x1="162" y1="163" x2="200" y2="163" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrowH)"/>

  <rect x="202" y="120" width="140" height="86" fill="#ffffff" stroke="#8c8686" stroke-width="1.25"/>
  <text x="272" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#201e1d">nginx</text>
  <text x="272" y="167" text-anchor="middle" font-size="11" font-weight="700" fill="#201e1d">Open Liberty</text>
  <text x="272" y="184" text-anchor="middle" font-size="9.5" fill="#6b6767">backend + frontend</text>

  <line x1="360" y1="163" x2="410" y2="163" stroke="#ec3013" stroke-width="1.75" marker-end="url(#arrowHb)"/>
  <text x="385" y="150" text-anchor="middle" font-size="9.5" fill="#ae1800">public</text>
  <text x="385" y="184" text-anchor="middle" font-size="9.5" fill="#ae1800">internet</text>

  <rect x="412" y="80" width="558" height="150" fill="#edf3ff" stroke="#0f62fe" stroke-width="1.5"/>
  <text x="434" y="104" font-size="11" font-weight="700" fill="#0043ce">IBM CLOUD — managed services (Lite plans)</text>

  <rect x="434" y="120" width="240" height="86" fill="#ffffff" stroke="#0f62fe" stroke-width="1.25"/>
  <text x="554" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#201e1d">Db2 on Cloud</text>
  <text x="554" y="170" text-anchor="middle" font-size="10" fill="#6b6767">SSL, CA cert in backend/certs/</text>

  <rect x="700" y="120" width="248" height="86" fill="#ffffff" stroke="#0f62fe" stroke-width="1.25"/>
  <text x="824" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#201e1d">App ID</text>
  <text x="824" y="169" text-anchor="middle" font-size="10" fill="#6b6767">Authorization Code + PKCE</text>
  <text x="824" y="185" text-anchor="middle" font-size="10" fill="#6b6767">token exchange proxied via backend</text>

  <rect x="30" y="255" width="940" height="2" fill="#8c8686"/>
  <text x="30" y="291" font-size="11.5" fill="#6b6767">Same backend WAR and React build as the other two models — DB_JDBC_URL/DB_DRIVER_CLASS point at Db2, and REACT_APP_AUTH_FLOW</text>
  <text x="30" y="311" font-size="11.5" fill="#6b6767">switches the frontend from Keycloak's in-page form to a redirect against App ID's hosted login page.</text>
  <text x="30" y="339" font-size="11.5" fill="#6b6767">Useful for developing/testing against the real managed services without deploying anywhere — nothing else leaves your machine.</text>
  <text x="30" y="374" font-size="11" fill="#ae1800" font-family="monospace">cp .env.cloud-services.example .env.cloud-services   # fill in Db2 / App ID values</text>
  <text x="30" y="396" font-size="11" fill="#ae1800" font-family="monospace">./scripts/start-cloud-services.sh</text>
</svg>
