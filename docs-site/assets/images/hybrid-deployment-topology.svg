<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ea3c4"/>
    </marker>
    <marker id="arrowHb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4589ff"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="420" rx="14" fill="#171c34" stroke="#262c4d" stroke-width="1.5"/>

  <text x="30" y="42" font-size="13" font-weight="700" fill="#e8e9f3">HYBRID — the app runs locally, the data and identity don't</text>

  <rect x="30" y="80" width="330" height="150" rx="10" fill="#151933" stroke="#262c4d" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text x="52" y="104" font-size="11" font-weight="700" fill="#9ea3c4">YOUR MACHINE — docker-compose.cloud-services.yml</text>

  <rect x="52" y="120" width="110" height="86" rx="8" fill="#0f1226" stroke="#3a4166" stroke-width="1.25"/>
  <text x="107" y="157" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e8e9f3">Browser</text>
  <text x="107" y="175" text-anchor="middle" font-size="10" fill="#9ea3c4">:3000</text>

  <line x1="162" y1="163" x2="200" y2="163" stroke="#9ea3c4" stroke-width="1.5" marker-end="url(#arrowH)"/>

  <rect x="202" y="120" width="140" height="86" rx="8" fill="#0f1226" stroke="#3a4166" stroke-width="1.25"/>
  <text x="272" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#e8e9f3">nginx</text>
  <text x="272" y="167" text-anchor="middle" font-size="11" font-weight="600" fill="#e8e9f3">Open Liberty</text>
  <text x="272" y="184" text-anchor="middle" font-size="9.5" fill="#9ea3c4">backend + frontend</text>

  <line x1="360" y1="163" x2="410" y2="163" stroke="#4589ff" stroke-width="1.75" marker-end="url(#arrowHb)"/>
  <text x="385" y="150" text-anchor="middle" font-size="9.5" fill="#78a9ff">public</text>
  <text x="385" y="184" text-anchor="middle" font-size="9.5" fill="#78a9ff">internet</text>

  <rect x="412" y="80" width="558" height="150" rx="10" fill="rgba(69,137,255,0.08)" stroke="#4589ff" stroke-width="1.5"/>
  <text x="434" y="104" font-size="11" font-weight="700" fill="#78a9ff">IBM CLOUD — managed services (Lite plans)</text>

  <rect x="434" y="120" width="240" height="86" rx="8" fill="#0f1226" stroke="#4589ff" stroke-width="1.25"/>
  <text x="554" y="152" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e9f3">Db2 on Cloud</text>
  <text x="554" y="170" text-anchor="middle" font-size="10" fill="#9ea3c4">SSL, CA cert in backend/certs/</text>

  <rect x="700" y="120" width="248" height="86" rx="8" fill="#0f1226" stroke="#4589ff" stroke-width="1.25"/>
  <text x="824" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e9f3">App ID</text>
  <text x="824" y="169" text-anchor="middle" font-size="10" fill="#9ea3c4">Authorization Code + PKCE</text>
  <text x="824" y="185" text-anchor="middle" font-size="10" fill="#9ea3c4">token exchange proxied via backend</text>

  <rect x="30" y="255" width="940" height="1" fill="#262c4d"/>
  <text x="30" y="291" font-size="11.5" fill="#9ea3c4">Same backend WAR and React build as the other two models — DB_JDBC_URL/DB_DRIVER_CLASS point at Db2, and REACT_APP_AUTH_FLOW</text>
  <text x="30" y="311" font-size="11.5" fill="#9ea3c4">switches the frontend from Keycloak's in-page form to a redirect against App ID's hosted login page.</text>
  <text x="30" y="339" font-size="11.5" fill="#9ea3c4">Useful for developing/testing against the real managed services without deploying anywhere — nothing else leaves your machine.</text>
  <text x="30" y="374" font-size="11" fill="#7c8cff" font-family="monospace">cp .env.cloud-services.example .env.cloud-services   # fill in Db2 / App ID values</text>
  <text x="30" y="396" font-size="11" fill="#7c8cff" font-family="monospace">./scripts/start-cloud-services.sh</text>
</svg>
