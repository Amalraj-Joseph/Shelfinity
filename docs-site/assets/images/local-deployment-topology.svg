<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ea3c4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="420" rx="14" fill="#171c34" stroke="#262c4d" stroke-width="1.5"/>

  <text x="30" y="42" font-size="13" font-weight="700" fill="#e8e9f3">LOCAL — one Docker Compose file, four containers</text>

  <rect x="30" y="80" width="150" height="70" rx="8" fill="#0f1226" stroke="#3a4166" stroke-width="1.25"/>
  <text x="105" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e9f3">Browser</text>
  <text x="105" y="131" text-anchor="middle" font-size="10.5" fill="#9ea3c4">:3000</text>

  <line x1="180" y1="115" x2="228" y2="115" stroke="#9ea3c4" stroke-width="1.5" marker-end="url(#arrowL)"/>
  <text x="204" y="103" text-anchor="middle" font-size="9.5" fill="#9ea3c4">Bearer</text>
  <text x="204" y="132" text-anchor="middle" font-size="9.5" fill="#9ea3c4">token</text>

  <rect x="230" y="70" width="220" height="90" rx="8" fill="#0f1226" stroke="#3a4166" stroke-width="1.25"/>
  <text x="340" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e9f3">React frontend</text>
  <text x="340" y="118" text-anchor="middle" font-size="10.5" fill="#9ea3c4">nginx-served, :3000</text>
  <text x="340" y="136" text-anchor="middle" font-size="10.5" fill="#9ea3c4">container: frontend</text>

  <line x1="450" y1="115" x2="500" y2="115" stroke="#9ea3c4" stroke-width="1.5" marker-end="url(#arrowL)"/>
  <text x="475" y="103" text-anchor="middle" font-size="9.5" fill="#9ea3c4">REST</text>

  <rect x="502" y="70" width="230" height="90" rx="8" fill="#0f1226" stroke="#3a4166" stroke-width="1.25"/>
  <text x="617" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e9f3">Open Liberty backend</text>
  <text x="617" y="118" text-anchor="middle" font-size="10.5" fill="#9ea3c4">Jakarta EE 10, :9080</text>
  <text x="617" y="136" text-anchor="middle" font-size="10.5" fill="#9ea3c4">container: backend</text>

  <line x1="617" y1="160" x2="617" y2="200" stroke="#9ea3c4" stroke-width="1.5" marker-end="url(#arrowL)"/>
  <text x="655" y="185" font-size="9.5" fill="#9ea3c4">JPA /</text>
  <text x="655" y="200" font-size="9.5" fill="#9ea3c4">EclipseLink</text>

  <rect x="502" y="202" width="230" height="80" rx="8" fill="#0f1226" stroke="#3a4166" stroke-width="1.25"/>
  <text x="617" y="234" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e9f3">PostgreSQL 15</text>
  <text x="617" y="254" text-anchor="middle" font-size="10.5" fill="#9ea3c4">:5432, container: postgres</text>

  <line x1="502" y1="105" x2="290" y2="200" stroke="#9ea3c4" stroke-width="1.5" marker-end="url(#arrowL)"/>
  <text x="360" y="175" font-size="9.5" fill="#9ea3c4">JWT verify (realm keys)</text>

  <rect x="230" y="202" width="220" height="80" rx="8" fill="#0f1226" stroke="#3a4166" stroke-width="1.25"/>
  <text x="340" y="234" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e9f3">Keycloak</text>
  <text x="340" y="254" text-anchor="middle" font-size="10.5" fill="#9ea3c4">:8080, realm shelfinity</text>

  <rect x="30" y="202" width="150" height="80" rx="8" fill="#151933" stroke="#262c4d" stroke-width="1.25" stroke-dasharray="4 3"/>
  <text x="105" y="234" text-anchor="middle" font-size="10.5" fill="#9ea3c4">Mailpit</text>
  <text x="105" y="252" text-anchor="middle" font-size="9.5" fill="#6b7299">SMTP catcher,</text>
  <text x="105" y="266" text-anchor="middle" font-size="9.5" fill="#6b7299">:8025 UI</text>

  <line x1="502" y1="130" x2="180" y2="242" stroke="#6b7299" stroke-width="1.25" stroke-dasharray="3 3"/>

  <rect x="30" y="320" width="940" height="1" fill="#262c4d"/>
  <text x="30" y="356" font-size="11.5" fill="#9ea3c4">The frontend never talks to Postgres or issues tokens itself — it exchanges credentials with Keycloak's token endpoint directly</text>
  <text x="30" y="376" font-size="11.5" fill="#9ea3c4">(Resource Owner Password Credentials grant) and sends the resulting JWT as a bearer token on every backend call.</text>
  <text x="30" y="404" font-size="11" fill="#7c8cff" font-family="monospace">docker compose -f docker/docker-compose.yml up -d --build   (or ./scripts/start.sh)</text>
</svg>
