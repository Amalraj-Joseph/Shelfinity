version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: shelfinity-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
 
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: shelfinity-keycloak
    command: ["start-dev", "--http-port=8080", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realm-shelfinity.json:/opt/keycloak/data/import/realm-shelfinity.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: shelfinity-backend
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: shelfinity
      DB_USER: shelfinity
      DB_PASSWORD: shelfinity
      OIDC_ISSUER: http://keycloak:8080/realms/shelfinity
      OIDC_AUDIENCE: shelfinity-backend
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "9080:9080"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          curl -s http://localhost:9080/health | grep -q '"status":"UP"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  db-seeder:
    image: postgres:15
    container_name: shelfinity-db-seeder
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PGPASSWORD: shelfinity
    volumes:
      - ./seed-data.sql:/seeds/seed-data.sql:ro
    entrypoint: [ "bash", "-lc" ]
    command: >
      "until pg_isready -h postgres -U shelfinity -d shelfinity; do sleep 1; done;
       psql -h postgres -U shelfinity -d shelfinity -f /seeds/seed-data.sql"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: shelfinity-frontend
    environment:
      - REACT_APP_API_URL=http://localhost:9080
      - REACT_APP_KEYCLOAK_URL=http://localhost:8080
      - REACT_APP_REALM=shelfinity
      - REACT_APP_CLIENT_ID=shelfinity-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data: