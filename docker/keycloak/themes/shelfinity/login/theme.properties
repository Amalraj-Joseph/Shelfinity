# Shelfinity — Keycloak login theme.
#
# Local-dev-only cosmetic layer: Keycloak hosts the registration page (and
# would host sign-in too, in pkce mode), and unlike IBM App ID — the
# production auth provider, which only exposes a logo + one header color —
# self-hosted Keycloak supports full CSS theming. This inherits keycloak.v2
# (PatternFly v5) structure/behavior untouched and only re-skins colors,
# type, and radius to match the Modernist design tokens
# (design_handoff_shelfinity_redesign/design/_ds/modernist-.../styles.css).
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css
