version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: shelfinity-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: shelfinity-keycloak
    command: ["start-dev", "--http-port=8080", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realm-shelfinity.json:/opt/keycloak/data/import/realm-shelfinity.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: shelfinity-backend
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: shelfinity
      DB_USER: shelfinity
      DB_PASSWORD: shelfinity
      # Must match the "iss" claim on tokens Keycloak actually issues — since
      # only the browser's network path (host-mapped localhost:8080) ever
      # produces a token, that's what's in it, even though this backend
      # container reaches Keycloak via the internal `keycloak` hostname.
      OIDC_ISSUER: http://localhost:8080/realms/shelfinity
      # Separate from OIDC_ISSUER on purpose: this is where the backend
      # container actually fetches the JWKS from, which must be the
      # internal Docker network hostname, not localhost (this container's
      # own loopback, not Keycloak's).
      OIDC_JWKS_URI: http://keycloak:8080/realms/shelfinity/protocol/openid-connect/certs
      OIDC_AUDIENCE: shelfinity-backend
      FRONTEND_URL: http://localhost:3000
      OPENAPI_SERVER_URL: http://localhost:9080
      # SPEC.md §10.6 — dev-only value. Never reuse this in a real deployment;
      # generate a real secret (e.g. `openssl rand -base64 32`).
      EMAIL_CONFIG_ENCRYPTION_KEY: dev-only-insecure-default-change-me
      BORROW_LOAN_DAYS: "14"
      RESERVATION_EXPIRY_DAYS: "7"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "9080:9080"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          curl -s http://localhost:9080/health | grep -q '"status":"UP"'
      interval: 10s
      timeout: 5s
      retries: 5


  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      # CRA bakes REACT_APP_* into the static bundle at build time — an
      # `environment:` block below would be silently ignored by the already-
      # built, nginx-served image. These must be build args instead.
      args:
        REACT_APP_KEYCLOAK_URL: http://localhost:8080
        REACT_APP_REALM: shelfinity
        REACT_APP_CLIENT_ID: shelfinity-frontend
        REACT_APP_API_BASE_URL: /api
    container_name: shelfinity-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data: