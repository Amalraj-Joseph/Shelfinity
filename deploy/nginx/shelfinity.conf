#
# Native-nginx equivalent of frontend/nginx.conf's server block — that one is
# a full nginx.conf for the standalone Docker image (its own events/http
# blocks included); this is just the site config for an OS-packaged nginx
# (dnf/apt install nginx), which already supplies events/http itself.
#
# Install: copy to /etc/nginx/conf.d/shelfinity.conf, deploy the React
# production build to /usr/share/nginx/html (frontend/build/ after
# `npm run build`), then `systemctl enable --now nginx` (or reload if
# already running). No separate systemd unit needed — nginx's own
# OS-provided service handles that.
#
# Only real difference from the Docker version: the backend is proxied via
# localhost, not a Docker network hostname — Liberty now runs natively on
# this same VM (see shelfinity-backend.service), not in a sibling container.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://localhost:9080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
