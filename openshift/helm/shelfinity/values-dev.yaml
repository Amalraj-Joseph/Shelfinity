# Development environment values for Shelfinity
global:
  namespace: shelfinity-dev
  environment: dev
  domain: apps-crc.testing

database:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
    storageClass: "local-storage"
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

keycloak:
  replicas: 1
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

backend:
  replicas: 1
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

frontend:
  replicas: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

autoscaling:
  backend:
    enabled: false
  frontend:
    enabled: false

monitoring:
  enabled: false

