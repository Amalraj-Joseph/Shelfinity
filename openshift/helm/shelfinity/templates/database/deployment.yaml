{{- if .Values.database.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.database.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "shelfinity.database.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.database.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "shelfinity.database.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shelfinity.database.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.security.podSecurityContext | nindent 8 }}
      {{- if .Values.database.persistence.enabled }}
      initContainers:
      - name: fix-permissions
        image: "{{ .Values.database.image.repository }}:{{ .Values.database.image.tag }}"
        command:
        - /bin/sh
        - -c
        - |
          chmod 777 /var/lib/pgsql/data
          chown -R 26:26 /var/lib/pgsql/data || true
        volumeMounts:
        - name: postgresql-data
          mountPath: /var/lib/pgsql/data
        securityContext:
          runAsUser: 0
      {{- end }}
      containers:
      - name: postgresql
        image: "{{ .Values.database.image.repository }}:{{ .Values.database.image.tag }}"
        imagePullPolicy: {{ .Values.database.image.pullPolicy }}
        securityContext:
          {{- toYaml .Values.security.containerSecurityContext | nindent 10 }}
        ports:
        - name: postgresql
          containerPort: 5432
          protocol: TCP
        env:
        - name: POSTGRESQL_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Values.database.name }}-secret
              key: POSTGRES_USER
        - name: POSTGRESQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.database.name }}-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRESQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: {{ .Values.database.name }}-secret
              key: POSTGRES_DB
        resources:
          {{- toYaml .Values.database.resources | nindent 10 }}
        volumeMounts:
        - name: postgresql-data
          mountPath: /var/lib/pgsql/data
        {{- if .Values.database.initScripts.enabled }}
        - name: init-scripts
          mountPath: {{ .Values.database.initScripts.mountPath }}
        {{- end }}
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U $POSTGRESQL_USER -d $POSTGRESQL_DATABASE
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U $POSTGRESQL_USER -d $POSTGRESQL_DATABASE
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: postgresql-data
        {{- if .Values.database.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ .Values.database.name }}-pvc
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- if .Values.database.initScripts.enabled }}
      - name: init-scripts
        configMap:
          name: {{ .Values.database.name }}-init-scripts
      {{- end }}
{{- end }}

