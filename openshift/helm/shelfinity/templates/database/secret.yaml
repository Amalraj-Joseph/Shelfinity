{{- if .Values.database.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.database.name }}-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "shelfinity.database.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.database.config.database }}
  POSTGRES_USER: {{ .Values.database.config.username }}
  POSTGRES_PASSWORD: {{ randAlphaNum 16 | b64enc | quote }}
  KEYCLOAK_DB: keycloak
  KEYCLOAK_USER: keycloak
  KEYCLOAK_PASSWORD: {{ randAlphaNum 16 | b64enc | quote }}
{{- end }}

