{{- if .Values.keycloak.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Values.keycloak.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "shelfinity.keycloak.labels" . | nindent 4 }}
spec:
  {{- if .Values.keycloak.route }}
  host: {{ .Values.keycloak.route.host | default (printf "keycloak-%s.%s" .Values.global.namespace .Values.global.domain) }}
  {{- else }}
  host: {{ printf "keycloak-%s.%s" .Values.global.namespace .Values.global.domain }}
  {{- end }}
  to:
    kind: Service
    name: {{ .Values.keycloak.name }}
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
{{- end }}

