{{- if .Values.backend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.backend.name }}-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "shelfinity.backend.labels" . | nindent 4 }}
data:
  DB_HOST: {{ .Values.backend.env.dbHost | quote }}
  DB_PORT: {{ .Values.backend.env.dbPort | quote }}
  DB_NAME: {{ .Values.backend.env.dbName | quote }}
  DB_USER: {{ .Values.backend.env.dbUser | quote }}
  OIDC_ISSUER: {{ .Values.backend.env.oidcIssuer | quote }}
  OIDC_AUDIENCE: {{ .Values.backend.env.oidcAudience | quote }}
  FRONTEND_URL: {{ printf "https://frontend-%s.%s" .Values.global.namespace .Values.global.domain | quote }}
  OPENAPI_SERVER_URL: {{ printf "https://backend-%s.%s/shelfinity-backend" .Values.global.namespace .Values.global.domain | quote }}
{{- end }}

