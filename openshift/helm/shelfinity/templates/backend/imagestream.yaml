{{- if .Values.backend.enabled }}
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: {{ .Values.backend.image.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "shelfinity.backend.labels" . | nindent 4 }}
spec:
  lookupPolicy:
    local: true
{{- end }}

