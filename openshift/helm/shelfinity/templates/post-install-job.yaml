apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-post-install
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "shelfinity.labels" . | nindent 4 }}
    app.kubernetes.io/component: post-install
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "shelfinity.labels" . | nindent 8 }}
        app.kubernetes.io/component: post-install
    spec:
      serviceAccountName: {{ include "shelfinity.serviceAccountName" . }}
      restartPolicy: Never
      containers:
      - name: configure-urls
        image: registry.redhat.io/openshift4/ose-cli:latest
        command:
        - /bin/bash
        - -c
        - |
          set -e
          
          echo "=== Post-Install Configuration ==="
          echo "Namespace: {{ .Values.global.namespace }}"
          
          # Wait for routes to be created
          echo "Waiting for routes to be ready..."
          sleep 10
          
          # Get route URLs
          FRONTEND_ROUTE=$(oc get route {{ .Values.frontend.name }} -n {{ .Values.global.namespace }} -o jsonpath='{.spec.host}' 2>/dev/null || echo "")
          BACKEND_ROUTE=$(oc get route {{ .Values.backend.name }} -n {{ .Values.global.namespace }} -o jsonpath='{.spec.host}' 2>/dev/null || echo "")
          KEYCLOAK_ROUTE=$(oc get route {{ .Values.keycloak.name }} -n {{ .Values.global.namespace }} -o jsonpath='{.spec.host}' 2>/dev/null || echo "")
          
          if [ -z "$FRONTEND_ROUTE" ] || [ -z "$BACKEND_ROUTE" ] || [ -z "$KEYCLOAK_ROUTE" ]; then
            echo "ERROR: One or more routes not found!"
            echo "Frontend: $FRONTEND_ROUTE"
            echo "Backend: $BACKEND_ROUTE"
            echo "Keycloak: $KEYCLOAK_ROUTE"
            exit 1
          fi
          
          # Construct full URLs with https
          FRONTEND_URL="https://${FRONTEND_ROUTE}"
          BACKEND_URL="https://${BACKEND_ROUTE}"
          KEYCLOAK_URL="https://${KEYCLOAK_ROUTE}"
          
          echo "=== Discovered Routes ==="
          echo "Frontend:  $FRONTEND_URL"
          echo "Backend:   $BACKEND_URL"
          echo "Keycloak:  $KEYCLOAK_URL"
          
          # Update Backend ConfigMap with Frontend URL for CORS
          echo ""
          echo "=== Updating Backend Configuration ==="
          oc patch configmap {{ .Values.backend.name }}-config -n {{ .Values.global.namespace }} \
            --type merge \
            -p "{\"data\":{\"FRONTEND_URL\":\"${FRONTEND_URL}\"}}"
          echo "✓ Backend ConfigMap updated with FRONTEND_URL"
          
          # Update Backend ConfigMap with Keycloak URL
          oc patch configmap {{ .Values.backend.name }}-config -n {{ .Values.global.namespace }} \
            --type merge \
            -p "{\"data\":{\"OIDC_ISSUER\":\"${KEYCLOAK_URL}/realms/{{ .Values.frontend.env.realm }}\"}}"
          echo "✓ Backend ConfigMap updated with OIDC_ISSUER"
          
          # Update Frontend ConfigMap with actual URLs
          echo ""
          echo "=== Updating Frontend Configuration ==="
          oc patch configmap {{ .Values.frontend.name }}-config -n {{ .Values.global.namespace }} \
            --type merge \
            -p "{\"data\":{\"REACT_APP_KEYCLOAK_URL\":\"${KEYCLOAK_URL}\",\"REACT_APP_API_URL\":\"${BACKEND_URL}\"}}"
          echo "✓ Frontend ConfigMap updated with actual URLs"
          
          # Restart deployments to pick up new configuration
          echo ""
          echo "=== Restarting Deployments ==="
          oc rollout restart deployment/{{ .Values.backend.name }} -n {{ .Values.global.namespace }}
          echo "✓ Backend deployment restarted"
          
          oc rollout restart deployment/{{ .Values.frontend.name }} -n {{ .Values.global.namespace }}
          echo "✓ Frontend deployment restarted"
          
          # Wait for rollouts to complete
          echo ""
          echo "=== Waiting for Rollouts ==="
          oc rollout status deployment/{{ .Values.backend.name }} -n {{ .Values.global.namespace }} --timeout=5m
          oc rollout status deployment/{{ .Values.frontend.name }} -n {{ .Values.global.namespace }} --timeout=5m
          
          echo ""
          echo "=== Configuration Complete ==="
          echo "✓ All services configured with correct URLs"
          echo "✓ CORS configured for: $FRONTEND_URL"
          echo ""
          echo "Access your application at:"
          echo "  Frontend: $FRONTEND_URL"
          echo "  Backend:  $BACKEND_URL"
          echo "  Keycloak: $KEYCLOAK_URL"

