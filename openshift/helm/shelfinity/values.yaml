# Default values for Shelfinity on OpenShift
# This is a YAML-formatted file.

global:
  namespace: shelfinity
  environment: dev
  domain: apps.cluster.example.com

# PostgreSQL Database Configuration
database:
  enabled: true
  name: postgresql
  image:
    repository: registry.redhat.io/rhel9/postgresql-15
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  persistence:
    enabled: true
    storageClass: ""
    size: 5Gi
  config:
    database: shelfinity
    username: shelfinity
    # Password should be set via secret
  initScripts:
    enabled: true
    mountPath: /docker-entrypoint-initdb.d

# Keycloak Configuration
keycloak:
  enabled: true
  name: keycloak
  image:
    repository: quay.io/keycloak/keycloak
    tag: "24.0.4"
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  config:
    adminUser: admin
    # adminPassword should be set via secret
    database:
      vendor: postgres
      host: postgresql
      port: 5432
      name: keycloak
      username: keycloak
      # password should be set via secret
  realm:
    import: true
    name: shelfinity

# Backend Service Configuration
backend:
  enabled: true
  name: backend
  replicas: 2
  image:
    repository: image-registry.openshift-image-registry.svc:5000
    name: shelfinity-backend
    tag: latest
    pullPolicy: Always
  build:
    enabled: true
    strategy: docker
    source:
      type: git
      contextDir: backend
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  service:
    type: ClusterIP
    port: 9080
    targetPort: 9080
  route:
    enabled: true
    host: ""  # Will be auto-generated if empty
    tls:
      enabled: true
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
  env:
    dbHost: postgresql
    dbPort: "5432"
    dbName: shelfinity
    dbUser: shelfinity
    oidcIssuer: http://keycloak:8080/realms/shelfinity
    oidcAudience: shelfinity-backend
  health:
    liveness:
      path: /health/live
      initialDelaySeconds: 120
      periodSeconds: 30
      timeoutSeconds: 10
    readiness:
      path: /health/ready
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5

# Frontend Service Configuration
frontend:
  enabled: true
  name: frontend
  replicas: 2
  image:
    repository: image-registry.openshift-image-registry.svc:5000
    name: shelfinity-frontend
    tag: latest
    pullPolicy: Always
  build:
    enabled: true
    strategy: docker
    source:
      type: git
      contextDir: frontend
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  route:
    enabled: true
    host: ""  # Will be auto-generated if empty
    tls:
      enabled: true
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
  env:
    apiUrl: ""  # Will be set to backend route
    keycloakUrl: ""  # Will be set to keycloak route
    realm: shelfinity
    clientId: shelfinity-frontend

# Security Configuration
security:
  serviceAccount:
    create: true
    name: shelfinity-sa
  networkPolicy:
    enabled: true
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true

# Monitoring Configuration
monitoring:
  enabled: false
  serviceMonitor:
    enabled: false
    interval: 30s

# Autoscaling Configuration
autoscaling:
  backend:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  frontend:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

