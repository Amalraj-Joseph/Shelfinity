<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Library System API Docs</title>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://unpkg.com/swagger-ui-dist/swagger-ui.css"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
      }
    </style>
  </head>

  <body>
    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>
    <script>
      window.onload = function () {
        SwaggerUIBundle({
          spec: {
            openapi: "3.0.3",
            info: {
              title: "Library System API",
              version: "1.0.0",
              description: "This API enables user registration, book borrowing, and admin management for the library system.",
            },
            servers: [
              {
                url: "https://api.library.example.com/v1",
              },
            ],
            paths: {
              "/register": {
                post: {
                  summary: "Register a new user",
                  requestBody: {
                    required: true,
                    content: {
                      "application/json": {
                        schema: {
                          $ref: "#/components/schemas/UserRegistrationRequest",
                        },
                      },
                    },
                  },
                  responses: {
                    "201": {
                      description: "User registered successfully",
                    },
                  },
                },
              },
              "/login": {
                post: {
                  summary: "Authenticate a user",
                  requestBody: {
                    required: true,
                    content: {
                      "application/json": {
                        schema: {
                          $ref: "#/components/schemas/LoginRequest",
                        },
                      },
                    },
                  },
                  responses: {
                    "200": {
                      description: "Successful login",
                      content: {
                        "application/json": {
                          schema: {
                            $ref: "#/components/schemas/AuthToken",
                          },
                        },
                      },
                    },
                  },
                },
              },
              "/password/change": {
                post: {
                  summary: "Change user password",
                  requestBody: {
                    required: true,
                    content: {
                      "application/json": {
                        schema: {
                          $ref: "#/components/schemas/ChangePasswordRequest",
                        },
                      },
                    },
                  },
                  responses: {
                    "204": {
                      description: "Password changed successfully",
                    },
                  },
                },
              },
              "/profile": {
                get: {
                  summary: "Retrieve user profile information",
                  responses: {
                    "200": {
                      description: "User profile returned",
                      content: {
                        "application/json": {
                          schema: {
                            $ref: "#/components/schemas/UserProfile",
                          },
                        },
                      },
                    },
                  },
                },
                put: {
                  summary: "Update user profile",
                  requestBody: {
                    required: true,
                    content: {
                      "application/json": {
                        schema: {
                          $ref: "#/components/schemas/UserProfileUpdateRequest",
                        },
                      },
                    },
                  },
                  responses: {
                    "204": {
                      description: "Profile updated",
                    },
                  },
                },
              },
              "/requests": {
                get: {
                  summary: "Fetch the admin’s pending request queue",
                  responses: {
                    "200": {
                      description: "Pending requests list",
                      content: {
                        "application/json": {
                          schema: {
                            type: "array",
                            items: {
                              $ref: "#/components/schemas/BorrowRequest",
                            },
                          },
                        },
                      },
                    },
                  },
                },
              },
              "/requests/approve": {
                post: {
                  summary: "Approve a pending request",
                  requestBody: {
                    required: true,
                    content: {
                      "application/json": {
                        schema: {
                          $ref: "#/components/schemas/RequestAction",
                        },
                      },
                    },
                  },
                  responses: {
                    "204": {
                      description: "Request approved",
                    },
                  },
                },
              },
              "/requests/decline": {
                post: {
                  summary: "Decline a pending request",
                  requestBody: {
                    required: true,
                    content: {
                      "application/json": {
                        schema: {
                          $ref: "#/components/schemas/RequestAction",
                        },
                      },
                    },
                  },
                  responses: {
                    "204": {
                      description: "Request declined",
                    },
                  },
                },
              },
              "/books/upload": {
                post: {
                  summary: "Bulk upload books from file",
                  requestBody: {
                    required: true,
                    content: {
                      "multipart/form-data": {
                        schema: {
                          type: "object",
                          properties: {
                            file: {
                              type: "string",
                              format: "binary",
                            },
                          },
                        },
                      },
                    },
                  },
                  responses: {
                    "202": {
                      description: "File uploaded and being processed",
                    },
                  },
                },
              },
              "/books": {
                get: {
                  summary: "Browse and filter available books",
                  responses: {
                    "200": {
                      description: "Book list returned",
                      content: {
                        "application/json": {
                          schema: {
                            type: "array",
                            items: {
                              $ref: "#/components/schemas/Book",
                            },
                          },
                        },
                      },
                    },
                  },
                },
                post: {
                  summary: "Add a new book",
                  requestBody: {
                    required: true,
                    content: {
                      "application/json": {
                        schema: {
                          $ref: "#/components/schemas/BookCreateRequest",
                        },
                      },
                    },
                  },
                  responses: {
                    "201": {
                      description: "Book added",
                    },
                  },
                },
              },
              "/books/{id}": {
                put: {
                  summary: "Update book details",
                  parameters: [
                    {
                      name: "id",
                      in: "path",
                      required: true,
                      schema: {
                        type: "string",
                      },
                    },
                  ],
                  requestBody: {
                    required: true,
                    content: {
                      "application/json": {
                        schema: {
                          $ref: "#/components/schemas/BookUpdateRequest",
                        },
                      },
                    },
                  },
                  responses: {
                    "204": {
                      description: "Book updated",
                    },
                  },
                },
                delete: {
                  summary: "Remove a book",
                  parameters: [
                    {
                      name: "id",
                      in: "path",
                      required: true,
                      schema: {
                        type: "string",
                      },
                    },
                  ],
                  responses: {
                    "204": {
                      description: "Book deleted",
                    },
                  },
                },
              },
              "/reports": {
                get: {
                  summary: "Generate reports for activity and availability",
                  responses: {
                    "200": {
                      description: "Reports data returned",
                    },
                  },
                },
              },
              "/email/config": {
                post: {
                  summary: "Register or update email server configuration",
                  requestBody: {
                    required: true,
                    content: {
                      "application/json": {
                        schema: {
                          $ref: "#/components/schemas/EmailConfig",
                        },
                      },
                    },
                  },
                  responses: {
                    "204": {
                      description: "Email configuration updated",
                    },
                  },
                },
              },
              "/borrow": {
                post: {
                  summary: "Submit a borrow request",
                  requestBody: {
                    required: true,
                    content: {
                      "application/json": {
                        schema: {
                          $ref: "#/components/schemas/BorrowRequest",
                        },
                      },
                    },
                  },
                  responses: {
                    "202": {
                      description: "Borrow request submitted",
                    },
                  },
                },
              },
              "/return": {
                post: {
                  summary: "Submit a return request",
                  requestBody: {
                    required: true,
                    content: {
                      "application/json": {
                        schema: {
                          $ref: "#/components/schemas/ReturnRequest",
                        },
                      },
                    },
                  },
                  responses: {
                    "202": {
                      description: "Return request accepted",
                    },
                  },
                },
              },
              "/reserve": {
                post: {
                  summary: "Reserve a currently unavailable book",
                  requestBody: {
                    required: true,
                    content: {
                      "application/json": {
                        schema: {
                          $ref: "#/components/schemas/ReservationRequest",
                        },
                      },
                    },
                  },
                  responses: {
                    "202": {
                      description: "Reservation request accepted",
                    },
                  },
                },
              },
            },
            components: {
              schemas: {
                UserRegistrationRequest: {
                  type: "object",
                  properties: {
                    username: { type: "string" },
                    email: { type: "string" },
                    password: { type: "string" },
                  },
                },
                LoginRequest: {
                  type: "object",
                  properties: {
                    email: { type: "string" },
                    password: { type: "string" },
                  },
                },
                AuthToken: {
                  type: "object",
                  properties: {
                    token: { type: "string" },
                  },
                },
                ChangePasswordRequest: {
                  type: "object",
                  properties: {
                    oldPassword: { type: "string" },
                    newPassword: { type: "string" },
                  },
                },
                UserProfile: {
                  type: "object",
                  properties: {
                    id: { type: "string" },
                    username: { type: "string" },
                    email: { type: "string" },
                  },
                },
                UserProfileUpdateRequest: {
                  type: "object",
                  properties: {
                    username: { type: "string" },
                    email: { type: "string" },
                  },
                },
                BorrowRequest: {
                  type: "object",
                  properties: {
                    userId: { type: "string" },
                    bookId: { type: "string" },
                  },
                },
                RequestAction: {
                  type: "object",
                  properties: {
                    requestId: { type: "string" },
                  },
                },
                Book: {
                  type: "object",
                  properties: {
                    id: { type: "string" },
                    title: { type: "string" },
                    author: { type: "string" },
                    available: { type: "boolean" },
                  },
                },
                BookCreateRequest: {
                  type: "object",
                  properties: {
                    title: { type: "string" },
                    author: { type: "string" },
                    isbn: { type: "string" },
                  },
                },
                BookUpdateRequest: {
                  type: "object",
                  properties: {
                    title: { type: "string" },
                    author: { type: "string" },
                  },
                },
                ReturnRequest: {
                  type: "object",
                  properties: {
                    userId: { type: "string" },
                    bookId: { type: "string" },
                  },
                },
                ReservationRequest: {
                  type: "object",
                  properties: {
                    userId: { type: "string" },
                    bookId: { type: "string" },
                  },
                },
                EmailConfig: {
                  type: "object",
                  properties: {
                    smtpServer: { type: "string" },
                    port: { type: "integer" },
                    username: { type: "string" },
                    password: { type: "string" },
                  },
                },
              },
            },
          },
          dom_id: "#swagger-ui",
        });
      };
    </script>
  </body>
</html>
