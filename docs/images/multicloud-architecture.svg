<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8250df"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="640" fill="#ffffff"/>

  <text x="620" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">Shelfinity — cloud deployment topology</text>
  <text x="620" y="55" text-anchor="middle" font-size="12.5" fill="#57606a">One VM, three free tiers: Cloudflare fronts it, Oracle Cloud runs it, IBM Cloud backs its data and identity</text>

  <!-- Browser -->
  <rect x="24" y="270" width="140" height="86" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="94" y="308" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2328">Browser</text>
  <text x="94" y="326" text-anchor="middle" font-size="11" fill="#57606a">React SPA</text>

  <!-- Arrow browser -> cloudflare -->
  <line x1="164" y1="313" x2="210" y2="313" stroke="#57606a" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="187" y="300" text-anchor="middle" font-size="10" fill="#57606a">HTTPS</text>

  <!-- Cloudflare zone -->
  <rect x="212" y="140" width="230" height="320" rx="14" fill="#fff4ec" stroke="#f38020" stroke-width="1.75"/>
  <text x="327" y="168" text-anchor="middle" font-size="13.5" font-weight="700" fill="#c8560e">Cloudflare</text>
  <text x="327" y="184" text-anchor="middle" font-size="10.5" fill="#c8560e">Free plan — edge</text>

  <rect x="234" y="204" width="186" height="64" rx="8" fill="#ffffff" stroke="#f38020" stroke-width="1.25"/>
  <text x="327" y="230" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">DNS + Universal SSL</text>
  <text x="327" y="247" text-anchor="middle" font-size="10.5" fill="#57606a">shelfinity-app.amalraj.dev</text>

  <line x1="327" y1="268" x2="327" y2="290" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="234" y="292" width="186" height="64" rx="8" fill="#ffffff" stroke="#f38020" stroke-width="1.25"/>
  <text x="327" y="318" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Cloudflare Tunnel</text>
  <text x="327" y="335" text-anchor="middle" font-size="10.5" fill="#57606a">cloudflared, outbound-only</text>

  <text x="327" y="400" text-anchor="middle" font-size="10.5" fill="#57606a">No inbound port opened</text>
  <text x="327" y="416" text-anchor="middle" font-size="10.5" fill="#57606a">on the VM's firewall</text>

  <!-- Arrow cloudflare -> OCI -->
  <line x1="442" y1="313" x2="488" y2="313" stroke="#57606a" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="465" y="300" text-anchor="middle" font-size="10" fill="#57606a">HTTP</text>

  <!-- OCI zone -->
  <rect x="490" y="90" width="290" height="450" rx="14" fill="#fdf1f0" stroke="#c74634" stroke-width="1.75"/>
  <text x="635" y="118" text-anchor="middle" font-size="13.5" font-weight="700" fill="#a53a2e">Oracle Cloud Infrastructure</text>
  <text x="635" y="134" text-anchor="middle" font-size="10.5" fill="#a53a2e">Always Free — 1 Compute VM</text>

  <rect x="512" y="152" width="246" height="56" rx="8" fill="#ffffff" stroke="#c74634" stroke-width="1.25"/>
  <text x="635" y="176" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">nginx</text>
  <text x="635" y="193" text-anchor="middle" font-size="10.5" fill="#57606a">static React build + /api proxy</text>

  <line x1="635" y1="208" x2="635" y2="228" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="512" y="230" width="246" height="64" rx="8" fill="#ffffff" stroke="#c74634" stroke-width="1.25"/>
  <text x="635" y="255" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Open Liberty</text>
  <text x="635" y="272" text-anchor="middle" font-size="10.5" fill="#57606a">Jakarta EE backend, native + systemd</text>

  <rect x="512" y="404" width="246" height="112" rx="8" fill="#ffffff" stroke="#8250df" stroke-width="1.25" stroke-dasharray="4 3"/>
  <text x="635" y="426" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">OCI Vault</text>
  <text x="635" y="443" text-anchor="middle" font-size="10.5" fill="#57606a">DB creds, App ID config,</text>
  <text x="635" y="458" text-anchor="middle" font-size="10.5" fill="#57606a">email encryption key</text>
  <text x="635" y="479" text-anchor="middle" font-size="10" fill="#8250df">via Instance Principals</text>
  <text x="635" y="494" text-anchor="middle" font-size="10" fill="#8250df">(no credential file on disk)</text>

  <line x1="635" y1="404" x2="635" y2="298" stroke="#8250df" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowDashed)"/>
  <text x="700" y="355" text-anchor="middle" font-size="10" fill="#8250df">vault-bootstrap</text>
  <text x="700" y="368" text-anchor="middle" font-size="10" fill="#8250df">(startup only)</text>

  <!-- Arrow OCI -> IBM -->
  <line x1="780" y1="220" x2="826" y2="220" stroke="#57606a" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="803" y="207" text-anchor="middle" font-size="10" fill="#57606a">JDBC/SSL</text>

  <line x1="780" y1="270" x2="826" y2="270" stroke="#57606a" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="803" y="288" text-anchor="middle" font-size="10" fill="#57606a">OIDC</text>

  <!-- IBM Cloud zone -->
  <rect x="828" y="140" width="260" height="320" rx="14" fill="#edf3ff" stroke="#0f62fe" stroke-width="1.75"/>
  <text x="958" y="168" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0043ce">IBM Cloud</text>
  <text x="958" y="184" text-anchor="middle" font-size="10.5" fill="#0043ce">Lite plans — managed services</text>

  <rect x="850" y="200" width="216" height="64" rx="8" fill="#ffffff" stroke="#0f62fe" stroke-width="1.25"/>
  <text x="958" y="225" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Db2 on Cloud</text>
  <text x="958" y="242" text-anchor="middle" font-size="10.5" fill="#57606a">managed relational database</text>

  <rect x="850" y="280" width="216" height="64" rx="8" fill="#ffffff" stroke="#0f62fe" stroke-width="1.25"/>
  <text x="958" y="305" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">App ID</text>
  <text x="958" y="322" text-anchor="middle" font-size="10.5" fill="#57606a">OIDC identity, Authorization Code + PKCE</text>

  <text x="958" y="400" text-anchor="middle" font-size="10.5" fill="#57606a">Both reached over the public</text>
  <text x="958" y="416" text-anchor="middle" font-size="10.5" fill="#57606a">internet from the OCI VM, TLS-verified</text>
  <text x="958" y="432" text-anchor="middle" font-size="10.5" fill="#57606a">against a bundled CA truststore</text>

  <!-- Legend -->
  <line x1="490" y1="560" x2="530" y2="560" stroke="#57606a" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="538" y="564" font-size="11" fill="#57606a">runtime request path</text>

  <line x1="700" y1="560" x2="740" y2="560" stroke="#8250df" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowDashed)"/>
  <text x="748" y="564" font-size="11" fill="#57606a">secrets fetched once at startup</text>

  <text x="620" y="605" text-anchor="middle" font-size="11" fill="#8c959f">Local dev (docker-compose) swaps this for Postgres + Keycloak on one machine — same code, config only.</text>
</svg>
