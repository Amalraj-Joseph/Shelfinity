<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 870" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="870" fill="#ffffff"/>

  <text x="560" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2328">Three ways to run Shelfinity — same codebase, config only</text>

  <!-- ============ ROW 1: LOCAL ============ -->
  <text x="40" y="115" font-size="20" font-weight="700" fill="#1f2328">Local</text>
  <text x="40" y="138" font-size="12.5" fill="#57606a">everything on your machine</text>
  <rect x="40" y="152" width="150" height="26" rx="13" fill="#f6f8fa" stroke="#57606a" stroke-width="1"/>
  <text x="115" y="169" text-anchor="middle" font-size="11.5" fill="#1f2328" font-family="monospace">scripts/start.sh</text>

  <rect x="230" y="80" width="850" height="150" rx="14" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="260" y="102" font-size="11.5" fill="#57606a" font-weight="600">YOUR MACHINE — Docker Compose</text>

  <rect x="256" y="120" width="120" height="86" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.25"/>
  <text x="316" y="157" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">Browser</text>
  <text x="316" y="175" text-anchor="middle" font-size="10" fill="#57606a">:3000</text>

  <line x1="376" y1="163" x2="418" y2="163" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="420" y="120" width="150" height="86" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.25"/>
  <text x="495" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">nginx</text>
  <text x="495" y="167" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2328">Open Liberty</text>
  <text x="495" y="184" text-anchor="middle" font-size="9.5" fill="#57606a">frontend + backend</text>

  <line x1="570" y1="150" x2="612" y2="128" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="176" x2="612" y2="198" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="614" y="97" width="140" height="60" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.25"/>
  <text x="684" y="121" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">PostgreSQL</text>
  <text x="684" y="138" text-anchor="middle" font-size="9.5" fill="#57606a">container</text>

  <rect x="614" y="169" width="140" height="60" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.25"/>
  <text x="684" y="193" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Keycloak</text>
  <text x="684" y="210" text-anchor="middle" font-size="9.5" fill="#57606a">container</text>

  <text x="900" y="150" text-anchor="middle" font-size="11" fill="#8c959f">database +</text>
  <text x="900" y="165" text-anchor="middle" font-size="11" fill="#8c959f">identity are</text>
  <text x="900" y="180" text-anchor="middle" font-size="11" fill="#8c959f">also containers</text>

  <line x1="40" y1="262" x2="1080" y2="262" stroke="#d0d7de" stroke-width="1"/>

  <!-- ============ ROW 2: HYBRID ============ -->
  <text x="40" y="317" font-size="20" font-weight="700" fill="#1f2328">Hybrid</text>
  <text x="40" y="340" font-size="12.5" fill="#57606a">app local, services in IBM Cloud</text>
  <rect x="40" y="354" width="190" height="26" rx="13" fill="#f6f8fa" stroke="#57606a" stroke-width="1"/>
  <text x="135" y="371" text-anchor="middle" font-size="10.5" fill="#1f2328" font-family="monospace">start-cloud-services.sh</text>

  <rect x="230" y="282" width="330" height="150" rx="14" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="260" y="304" font-size="11.5" fill="#57606a" font-weight="600">YOUR MACHINE — Docker Compose</text>

  <rect x="256" y="322" width="110" height="86" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.25"/>
  <text x="311" y="359" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">Browser</text>
  <text x="311" y="377" text-anchor="middle" font-size="10" fill="#57606a">:3000</text>

  <line x1="366" y1="365" x2="404" y2="365" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="406" y="322" width="140" height="86" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.25"/>
  <text x="476" y="352" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">nginx</text>
  <text x="476" y="369" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2328">Open Liberty</text>
  <text x="476" y="386" text-anchor="middle" font-size="9.5" fill="#57606a">frontend + backend</text>

  <line x1="560" y1="365" x2="608" y2="365" stroke="#0f62fe" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="584" y="352" text-anchor="middle" font-size="9.5" fill="#0043ce">over the</text>
  <text x="584" y="405" text-anchor="middle" font-size="9.5" fill="#0043ce">internet</text>

  <rect x="610" y="282" width="470" height="150" rx="14" fill="#edf3ff" stroke="#0f62fe" stroke-width="1.5"/>
  <text x="640" y="304" font-size="11.5" font-weight="700" fill="#0043ce">IBM CLOUD — managed services</text>

  <rect x="636" y="322" width="200" height="86" rx="8" fill="#ffffff" stroke="#0f62fe" stroke-width="1.25"/>
  <text x="736" y="358" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">Db2 on Cloud</text>
  <text x="736" y="376" text-anchor="middle" font-size="10" fill="#57606a">database</text>

  <rect x="856" y="322" width="200" height="86" rx="8" fill="#ffffff" stroke="#0f62fe" stroke-width="1.25"/>
  <text x="956" y="358" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">App ID</text>
  <text x="956" y="376" text-anchor="middle" font-size="10" fill="#57606a">OIDC identity</text>

  <line x1="40" y1="464" x2="1080" y2="464" stroke="#d0d7de" stroke-width="1"/>

  <!-- ============ ROW 3: MULTI-CLOUD ============ -->
  <text x="40" y="519" font-size="20" font-weight="700" fill="#1f2328">Multi-cloud</text>
  <text x="40" y="542" font-size="12.5" fill="#57606a">the app itself is in the cloud too</text>
  <rect x="40" y="556" width="190" height="26" rx="13" fill="#f6f8fa" stroke="#57606a" stroke-width="1"/>
  <text x="135" y="573" text-anchor="middle" font-size="10" fill="#1f2328" font-family="monospace">deploy-to-vm.sh + vm-setup.sh</text>

  <rect x="230" y="484" width="130" height="150" rx="14" fill="#fff4ec" stroke="#f38020" stroke-width="1.5"/>
  <text x="295" y="506" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c8560e">CLOUDFLARE</text>
  <rect x="248" y="522" width="94" height="94" rx="8" fill="#ffffff" stroke="#f38020" stroke-width="1.25"/>
  <text x="295" y="558" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2328">Tunnel +</text>
  <text x="295" y="573" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2328">DNS/TLS</text>
  <text x="295" y="595" text-anchor="middle" font-size="9" fill="#57606a">no open port</text>

  <line x1="360" y1="559" x2="398" y2="559" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="400" y="484" width="320" height="150" rx="14" fill="#fdf1f0" stroke="#c74634" stroke-width="1.5"/>
  <text x="430" y="506" font-size="10.5" font-weight="700" fill="#a53a2e">ORACLE CLOUD (OCI) — 1 VM</text>

  <rect x="418" y="522" width="160" height="86" rx="8" fill="#ffffff" stroke="#c74634" stroke-width="1.25"/>
  <text x="498" y="552" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">nginx</text>
  <text x="498" y="569" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2328">Open Liberty</text>
  <text x="498" y="586" text-anchor="middle" font-size="9.5" fill="#57606a">native, systemd</text>

  <rect x="594" y="522" width="108" height="86" rx="8" fill="#ffffff" stroke="#7c5cff" stroke-width="1.25" stroke-dasharray="4 3"/>
  <text x="648" y="552" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2328">OCI Vault</text>
  <text x="648" y="569" text-anchor="middle" font-size="9" fill="#57606a">secrets, at boot</text>
  <text x="648" y="584" text-anchor="middle" font-size="9" fill="#57606a">Instance Principals</text>

  <line x1="594" y1="565" x2="580" y2="565" stroke="#7c5cff" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <line x1="720" y1="559" x2="758" y2="559" stroke="#0f62fe" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="760" y="484" width="320" height="150" rx="14" fill="#edf3ff" stroke="#0f62fe" stroke-width="1.5"/>
  <text x="790" y="506" font-size="10.5" font-weight="700" fill="#0043ce">IBM CLOUD — managed services</text>

  <rect x="778" y="522" width="150" height="86" rx="8" fill="#ffffff" stroke="#0f62fe" stroke-width="1.25"/>
  <text x="853" y="558" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Db2 on Cloud</text>
  <text x="853" y="576" text-anchor="middle" font-size="9.5" fill="#57606a">database</text>

  <rect x="944" y="522" width="118" height="86" rx="8" fill="#ffffff" stroke="#0f62fe" stroke-width="1.25"/>
  <text x="1003" y="558" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">App ID</text>
  <text x="1003" y="576" text-anchor="middle" font-size="9.5" fill="#57606a">OIDC identity</text>

  <text x="560" y="655" text-anchor="middle" font-size="9.5" fill="#8c959f">OCI Vault supplies this VM's secrets at boot via Instance Principals — no credential file on disk</text>

  <!-- ============ FOOTER ============ -->
  <rect x="40" y="710" width="1040" height="1" fill="#d0d7de"/>
  <text x="560" y="750" text-anchor="middle" font-size="13" fill="#57606a">Same backend WAR, same React build, every time — only DB_JDBC_URL/DB_DRIVER_CLASS and REACT_APP_AUTH_FLOW change.</text>
  <text x="560" y="772" text-anchor="middle" font-size="13" fill="#57606a">Full per-model topology diagrams: see the Architecture docs.</text>

  <!-- legend -->
  <rect x="330" y="815" width="16" height="16" rx="3" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.25" stroke-dasharray="4 3"/>
  <text x="354" y="828" font-size="12" fill="#57606a">your machine</text>
  <rect x="470" y="815" width="16" height="16" rx="3" fill="#edf3ff" stroke="#0f62fe" stroke-width="1.25"/>
  <text x="494" y="828" font-size="12" fill="#57606a">IBM Cloud</text>
  <rect x="600" y="815" width="16" height="16" rx="3" fill="#fdf1f0" stroke="#c74634" stroke-width="1.25"/>
  <text x="624" y="828" font-size="12" fill="#57606a">Oracle Cloud (OCI)</text>
  <rect x="770" y="815" width="16" height="16" rx="3" fill="#fff4ec" stroke="#f38020" stroke-width="1.25"/>
  <text x="794" y="828" font-size="12" fill="#57606a">Cloudflare</text>
  <rect x="900" y="815" width="16" height="16" rx="3" fill="#ffffff" stroke="#7c5cff" stroke-width="1.25" stroke-dasharray="4 3"/>
  <text x="924" y="828" font-size="12" fill="#57606a">secrets, at boot only</text>
</svg>
