openapi: 3.0.3
info:
  title: Shelfinity Library Management System API
  description: >
    RESTful API for managing library books, users, borrow/return requests,
    reservations, overdue tracking, email configuration, and reports.
    Authentication is delegated entirely to Keycloak (OIDC) — this API validates
    bearer tokens, it does not issue them or store credentials.
  version: 1.0.0
  contact:
    name: Amalraj Joseph
servers:
  - url: http://localhost:9080/api
    description: Local development server

tags:
  - name: Health
  - name: Authentication
  - name: Users
  - name: Books
  - name: Queue
  - name: Reservations
  - name: Overdue
  - name: Email Configuration
  - name: Reports

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: Application is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "UP" }
                  timestamp: { type: string, format: date-time }

  # ---------------------------------------------------------------- Auth
  /auth/login:
    post:
      tags: [Authentication]
      summary: Validate the current Keycloak token and return the local user record
      description: >
        Does not authenticate — Keycloak does that. This validates the bearer token
        already presented and looks up (or, per SPEC.md §6.1, will provision-pending)
        the corresponding local User row.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Token valid, user found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Authenticated in Keycloak but no local user record exists yet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/validate:
    get:
      tags: [Authentication]
      summary: Validate the current token
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get the current authenticated user's profile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Profile retrieved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------- Users
  /users:
    post:
      tags: [Users]
      summary: Create a user record
      description: >
        SPEC.md §10.1/§10.3 (both resolved): a non-admin caller may only create a
        record for their own keycloakId, with a caller-supplied role of ADMIN only
        honored when the caller is already an admin; a self-service caller is
        created with `active=false` plus a USER_REGISTRATION queue item, while an
        admin-created account is `active=true` immediately.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: User already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      tags: [Users]
      summary: List all users (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Users retrieved
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserResponse' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/me:
    get:
      tags: [Users]
      summary: Get the current user's profile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Profile retrieved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/UuidId'
    get:
      tags: [Users]
      summary: Get a user by ID
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User retrieved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Users]
      summary: Update a user, including role reassignment (admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Users]
      summary: Delete a user (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: User deleted }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- Books
  /books:
    get:
      tags: [Books]
      summary: List books
      parameters:
        - name: availableOnly
          in: query
          schema: { type: boolean }
        - name: genre
          in: query
          description: "Filter by genre (case-insensitive exact match) — SPEC.md §10.4, resolved"
          schema: { type: string }
      responses:
        '200':
          description: Books retrieved
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BookResponse' }
    post:
      tags: [Books]
      summary: Create a book (admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookRequest' }
      responses:
        '201':
          description: Book created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A book with this ISBN already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /books/available:
    get:
      tags: [Books]
      summary: List currently available books
      responses:
        '200':
          description: Available books retrieved
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BookResponse' }

  /books/search:
    get:
      tags: [Books]
      summary: Search books by title or author
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BookResponse' }
        '400':
          description: Search query is required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /books/bulk-upload:
    post:
      tags: [Books]
      summary: Bulk-upload books from a CSV file (admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Upload processed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkUploadResult' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /books/bulk-upload/template:
    get:
      tags: [Books]
      summary: Download the CSV template for bulk upload
      responses:
        '200':
          description: CSV template
          content:
            text/csv:
              schema: { type: string }

  /books/{id}:
    parameters:
      - $ref: '#/components/parameters/UuidId'
    get:
      tags: [Books]
      summary: Get a book by ID
      responses:
        '200':
          description: Book retrieved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookResponse' }
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Books]
      summary: Update a book (admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookRequest' }
      responses:
        '200':
          description: Book updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookResponse' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Books]
      summary: Delete a book (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Book deleted }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- Queue
  /queues:
    post:
      tags: [Queue]
      summary: Submit a borrow, return, or registration-approval request
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateQueueItemRequest' }
      responses:
        '201':
          description: Queue item created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueItemResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [Queue]
      summary: List all queue items (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/QueueStatus' }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/QueueType' }
      responses:
        '200':
          description: Queue items retrieved
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/QueueItemResponse' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /queues/my:
    get:
      tags: [Queue]
      summary: List the current user's queue items
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Queue items retrieved
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/QueueItemResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /queues/{id}:
    parameters:
      - $ref: '#/components/parameters/UuidId'
    get:
      tags: [Queue]
      summary: Get a queue item by ID
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Queue item retrieved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueItemResponse' }
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Queue]
      summary: Delete a queue item (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Queue item deleted }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /queues/{id}/status:
    parameters:
      - $ref: '#/components/parameters/UuidId'
    patch:
      tags: [Queue]
      summary: Approve or reject a queue item (admin only)
      description: >
        Behavior per SPEC.md §6.1/§6.2/§6.3, all resolved: on BOOK_BORROW
        approval, decrements book availability (409 if none left) and sets a due
        date; on BOOK_RETURN approval, increments availability and promotes the
        oldest active reservation if one exists, resetting its claim-window
        expiry; on USER_REGISTRATION approval, activates the user account.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateQueueItemRequest' }
      responses:
        '200':
          description: Queue item updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueItemResponse' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- Reservations
  /reservations:
    post:
      tags: [Reservations]
      summary: Reserve a currently unavailable book
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReservationRequest' }
      responses:
        '201':
          description: Reservation created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationResponse' }
        '400':
          description: Book is currently available, or already reserved by this user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [Reservations]
      summary: List all reservations (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Reservations retrieved
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReservationResponse' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /reservations/my:
    get:
      tags: [Reservations]
      summary: List the current user's reservations
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Reservations retrieved
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReservationResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /reservations/{id}:
    parameters:
      - $ref: '#/components/parameters/UuidId'
    delete:
      tags: [Reservations]
      summary: Cancel a reservation (owner or admin)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Reservation cancelled }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /reservations/{id}/fulfill:
    parameters:
      - $ref: '#/components/parameters/UuidId'
    post:
      tags: [Reservations]
      summary: Mark a reservation as fulfilled (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Reservation fulfilled }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- Overdue
  /overdue:
    get:
      tags: [Overdue]
      summary: List all overdue items (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Overdue items retrieved
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/QueueItemResponse' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /overdue/my:
    get:
      tags: [Overdue]
      summary: List the current user's overdue items
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Overdue items retrieved
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/QueueItemResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /overdue/stats:
    get:
      tags: [Overdue]
      summary: Get overdue statistics (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Statistics retrieved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverdueStats' }
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------- Email config
  /email/config:
    post:
      tags: [Email Configuration]
      summary: Create or replace the email configuration (admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailConfig' }
      responses:
        '200':
          description: Configuration saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailConfig' }
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [Email Configuration]
      summary: List all email configurations (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Configurations retrieved
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EmailConfig' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /email/config/active:
    get:
      tags: [Email Configuration]
      summary: Get the currently active email configuration (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Active configuration retrieved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailConfig' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No active configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /email/config/test:
    post:
      tags: [Email Configuration]
      summary: Send a test email using the active configuration (admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string, format: email }
      responses:
        '200': { description: Test email sent }
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Failed to send test email
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /email/config/{id}:
    parameters:
      - $ref: '#/components/parameters/UuidId'
    put:
      tags: [Email Configuration]
      summary: Update an email configuration (admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailConfig' }
      responses:
        '200':
          description: Configuration updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailConfig' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Email Configuration]
      summary: Delete an email configuration (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Configuration deleted }
        '403':
          $ref: '#/components/responses/Forbidden'

  /email/config/{id}/activate:
    parameters:
      - $ref: '#/components/parameters/UuidId'
    post:
      tags: [Email Configuration]
      summary: Activate a specific email configuration (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Configuration activated }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- Reports
  /reports/book-popularity:
    get:
      tags: [Reports]
      summary: Most-borrowed books (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Report retrieved
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BookPopularityReport' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /reports/borrowing-trends:
    get:
      tags: [Reports]
      summary: Borrowing trends over a time window (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: days
          in: query
          schema: { type: integer, default: 30 }
      responses:
        '200':
          description: Report retrieved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BorrowingTrendsReport' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /reports/user-activity:
    get:
      tags: [Reports]
      summary: Most active users (admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Report retrieved
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserActivityReport' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /reports/statistics:
    get:
      tags: [Reports]
      summary: Overall library statistics (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Statistics retrieved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryStatistics' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /reports/author-distribution:
    get:
      tags: [Reports]
      summary: Book count by author (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Report retrieved
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuthorDistribution' }
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak-issued OIDC access token.

  parameters:
    UuidId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Authenticated but not permitted (e.g. admin-only endpoint)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadRequest:
      description: Invalid request data
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ErrorResponse:
      type: object
      properties:
        error: { type: string }

    UserRole:
      type: string
      enum: [USER, ADMIN]

    QueueType:
      type: string
      enum: [USER_REGISTRATION, BOOK_BORROW, BOOK_RETURN, BOOK_RESERVATION]
      description: >
        BOOK_RESERVATION exists in the enum but is legacy/unused — reservations
        are modeled as their own resource. See SPEC.md §5.3.

    QueueStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]

    ReservationStatus:
      type: string
      enum: [ACTIVE, NOTIFIED, FULFILLED, CANCELLED, EXPIRED]

    UserResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        keycloakId: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }
        active:
          type: boolean
          description: "false while a USER_REGISTRATION queue item is pending — see SPEC.md §6.1"
        createdAt: { type: string, format: date-time }

    CreateUserRequest:
      type: object
      required: [keycloakId, email, name]
      properties:
        keycloakId: { type: string, example: "123e4567-e89b-12d3-a456-426614174000" }
        email: { type: string, format: email }
        name: { type: string }
        role:
          $ref: '#/components/schemas/UserRole'
