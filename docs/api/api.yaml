openapi: 3.0.3
info:
  title: Shelfinity Library Management System API
  description: RESTful API for managing library books, users, and requests
  version: 1.0.0
  contact:
    name: Shadow-Codex
servers:
  - url: http://localhost:9080/api
    description: Development server

paths:
  /health:
    get:
      summary: Health check endpoint
      description: Returns the health status of the application
      responses:
        '200':
          description: Application is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "UP"
                  timestamp:
                    type: string
                    format: date-time

  /users:
    get:
      summary: Get all users
      description: Retrieve a list of all users in the system
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of users retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

    post:
      summary: Create a new user
      description: Create a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Bad request
        '409':
          description: User already exists

  /users/{id}:
    get:
      summary: Get user by ID
      description: Retrieve a specific user by their ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found

  /books:
    get:
      summary: Get all books
      description: Retrieve a list of all books in the library
      parameters:
        - name: search
          in: query
          description: Search term for book title or author
          schema:
            type: string
        - name: available
          in: query
          description: Filter by availability
          schema:
            type: boolean
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of books retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookResponse'
        '401':
          description: Unauthorized

    post:
      summary: Create a new book
      description: Add a new book to the library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookRequest'
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Book created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /books/{id}:
    get:
      summary: Get book by ID
      description: Retrieve a specific book by its ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Book retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '404':
          description: Book not found

  /queues:
    get:
      summary: Get all queue items
      description: Retrieve all queue items (admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of queue items retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QueueItemResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

    post:
      summary: Create a new queue item
      description: Submit a new request (borrow, return, etc.)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQueueItemRequest'
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Queue item created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueItemResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /queues/{id}:
    patch:
      summary: Update queue item
      description: Update the status of a queue item (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQueueItemRequest'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Queue item updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueItemResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Queue item not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          description: User ID
        email:
          type: string
          format: email
          description: User email address
        firstName:
          type: string
          description: User first name
        lastName:
          type: string
          description: User last name
        role:
          type: string
          enum: [USER, ADMIN]
          description: User role
        createdAt:
          type: string
          format: date-time
          description: Account creation timestamp

    CreateUserRequest:
      type: object
      required:
        - email
        - firstName
        - lastName
        - password
      properties:
        email:
          type: string
          format: email
          description: User email address
        firstName:
          type: string
          description: User first name
        lastName:
          type: string
          description: User last name
        password:
          type: string
          minLength: 6
          description: User password
        role:
          type: string
          enum: [USER, ADMIN]
          default: USER
          description: User role

    BookResponse:
      type: object
      properties:
        id:
          type: integer
          description: Book ID
        title:
          type: string
          description: Book title
        author:
          type: string
          description: Book author
        isbn:
          type: string
          description: Book ISBN
        description:
          type: string
          description: Book description
        totalCopies:
          type: integer
          description: Total number of copies
        availableCopies:
          type: integer
          description: Number of available copies
        available:
          type: boolean
          description: Whether the book is available for borrowing
        createdAt:
          type: string
          format: date-time
          description: Book creation timestamp

    CreateBookRequest:
      type: object
      required:
        - title
        - author
        - totalCopies
      properties:
        title:
          type: string
          description: Book title
        author:
          type: string
          description: Book author
        isbn:
          type: string
          description: Book ISBN
        description:
          type: string
          description: Book description
        totalCopies:
          type: integer
          minimum: 1
          description: Total number of copies

    QueueItemResponse:
      type: object
      properties:
        id:
          type: integer
          description: Queue item ID
        type:
          type: string
          enum: [BOOK_BORROW, BOOK_RETURN, BOOK_REQUEST]
          description: Type of request
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
          description: Request status
        userId:
          type: integer
          description: User ID who made the request
        bookId:
          type: integer
          description: Book ID (if applicable)
        description:
          type: string
          description: Request description
        adminRemark:
          type: string
          description: Admin remarks
        createdAt:
          type: string
          format: date-time
          description: Request creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp

    CreateQueueItemRequest:
      type: object
      required:
        - type
        - description
      properties:
        type:
          type: string
          enum: [BOOK_BORROW, BOOK_RETURN, BOOK_REQUEST]
          description: Type of request
        bookId:
          type: integer
          description: Book ID (required for book-related requests)
        description:
          type: string
          description: Request description

    UpdateQueueItemRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
          description: New status for the request
        adminRemark:
          type: string
          description: Admin remarks
