mp.openapi.filter=com.shelfinity.openapi.TaggingFilter
mp.openapi.servers=${OPENAPI_SERVER_URL:http://localhost:9080}
mp.openapi.info.title=Shelfinity API
mp.openapi.info.version=1.0.0

# SPEC.md §10.5 (resolved) — reservation claim/hold window, in days.
reservation.expiry.days=${RESERVATION_EXPIRY_DAYS:7}

# SPEC.md §6.2 step 3 — default borrow loan period, in days.
borrow.loan.days=${BORROW_LOAN_DAYS:14}

# SPEC.md §10.6 (resolved) — key used to derive the AES-256 key that encrypts
# EmailConfig.password at rest (see EncryptedStringConverter). The default
# below is dev-only and INSECURE — every production deployment MUST override
# this via the EMAIL_CONFIG_ENCRYPTION_KEY environment variable with a long,
# random, secret value kept outside version control.
email.config.encryption.key=${EMAIL_CONFIG_ENCRYPTION_KEY:dev-only-insecure-default-change-me}

